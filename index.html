<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل القنوات الفضائية - Satellite Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      direction: rtl;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--accent);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .search-box {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: var(--text);
      width: 100%;
      max-width: 350px;
      font-size: 15px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cat-btn {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      color: var(--text);
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      background: #0284c7;
      color: #fff;
      margin-bottom: 12px;
      width: fit-content;
    }

    .info-row {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .info-row span {
      color: var(--text);
    }

    .now-playing {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #334155;
      font-size: 13px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <h1>📡 منصة دليل القنوات الفضائية</h1>
    <p>تصفح الترددات وجدول البث المباشر لأهم القنوات</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم القناة أو القمر الصناعي...">
    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory('الكل')">الكل</button>
      <button class="cat-btn" onclick="filterCategory('أخبار')">أخبار</button>
      <button class="cat-btn" onclick="filterCategory('رياضة')">رياضة</button>
      <button class="cat-btn" onclick="filterCategory('وثائقي')">وثائقي</button>
    </div>
  </div>

  <div class="grid" id="channelsGrid"></div>

  <script>
    const channels = [
      {
        name: "قناة الجزيرة الإخبارية",
        category: "أخبار",
        satellite: "نايل سات / سهيل سات",
        frequency: "10971 H (27500)",
        quality: "HD",
        currentShow: "نشرة الأخبار الرئيسية"
      },
      {
        name: "بي إن سبورت الإخبارية",
        category: "رياضة",
        satellite: "نايل سات",
        frequency: "11054 H (27500)",
        quality: "HD",
        currentShow: "حصاد الأسبوع الرياضي"
      },
      {
        name: "العربية الإخبارية",
        category: "أخبار",
        satellite: "نايل سات / عرب سات",
        frequency: "11747 V (27500)",
        quality: "HD",
        currentShow: "تغطيات خاصة وأحداث الساعة"
      },
      {
        name: "ناشونال جيوغرافيك أبوظبي",
        category: "وثائقي",
        satellite: "نايل سات",
        frequency: "11411 H (30000)",
        quality: "HD",
        currentShow: "أسرار الحياة البرية"
      },
      {
        name: "الكأس الرياضية",
        category: "رياضة",
        satellite: "سهيل سات / نايل سات",
        frequency: "11919 H (27500)",
        quality: "HD",
        currentShow: "تحليل ما قبل المباراة"
      }
    ];

    let activeCategory = 'الكل';

    function renderChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';

      const filtered = channels.filter(c => {
        const matchesCategory = (activeCategory === 'الكل' || c.category === activeCategory);
        const matchesQuery = c.name.toLowerCase().includes(query) || c.satellite.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">لا توجد قنوات مطابقة لبحثك.</p>';
        return;
      }

      filtered.forEach(c => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <span class="badge">${c.quality}</span>
            <h3>${c.name}</h3>
            <div class="info-row">القمر: <span>${c.satellite}</span></div>
            <div class="info-row">التردد: <span>${c.frequency}</span></div>
            <div class="info-row">التصنيف: <span>${c.category}</span></div>
          </div>
          <div class="now-playing">
            🕒 يعرض الآن: <strong>${c.currentShow}</strong>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === cat);
      });
      renderChannels();
    }

    document.getElementById('searchInput').addEventListener('input', renderChannels);
    renderChannels();
  </script>
</body>
</html>
